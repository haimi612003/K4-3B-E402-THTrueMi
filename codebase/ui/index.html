<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class Pulse</title>
<style>
:root{
  color-scheme:light;
  --topbar:#2563eb; --topbar-ink:#dce8ff;
  --page:#f4f6f8; --panel:#fff; --surface-2:#f1f3f6;
  --ink:#0b0b0b; --ink-2:#4b5563; --muted:#8a8f98;
  --line:#e3e7ec; --line-2:#eef1f5;
  --primary:#2563eb; --primary-ink:#fff; --go:#16a34a;
  /* màu dữ liệu — bảng đã kiểm CVD, không đổi theo thương hiệu */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --critical:#d03b3b;
  --good-ink:#0a7a0a; --warn-ink:#7a5605; --critical-ink:#a32020;
  --grid:#e1e0d9; --baseline:#c3c2b7;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --topbar:#132038; --topbar-ink:#9fb6d8;
    --page:#0d0d0d; --panel:#151f1e; --surface-2:#232321;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8a8f98;
    --line:#2b3138; --line-2:#22272d;
    --primary:#3987e5; --go:#22a34a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-ink:#37c437; --warn-ink:#d8b155; --critical-ink:#ff8f8f;
    --grid:#2c2c2a; --baseline:#383835;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --topbar:#132038; --topbar-ink:#9fb6d8;
  --page:#0d0d0d; --panel:#151f1e; --surface-2:#232321;
  --ink:#fff; --ink-2:#c3c2b7; --muted:#8a8f98;
  --line:#2b3138; --line-2:#22272d;
  --primary:#3987e5; --go:#22a34a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#37c437; --warn-ink:#d8b155; --critical-ink:#ff8f8f;
  --grid:#2c2c2a; --baseline:#383835;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:.92em}

/* ── khung: thanh trên + vùng nội dung ───────────── */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh;overflow:hidden}
.topbar{background:var(--topbar);color:#fff;display:flex;align-items:center;gap:22px;padding:0 20px}
.topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;padding-right:18px;border-right:1px solid rgba(255,255,255,.22);white-space:nowrap}
.topbar .brand .logo{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px}
.topbar nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.topbar nav::-webkit-scrollbar{display:none}
.topbar nav button{background:none;border:0;color:var(--topbar-ink);font-size:13.5px;padding:6px 12px;border-radius:7px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.topbar nav button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.topbar nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.topbar nav button[aria-current=page]{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .right button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px;white-space:nowrap}

.main{overflow-y:auto;background:var(--page)}
.inner{max-width:1280px;margin:0 auto}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 22px 0;font-size:13.5px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.5}
.crumbs .acts{margin-left:auto;display:flex;gap:14px;align-items:center}
.crumbs .acts a{font-size:13px;text-decoration:none}
.chipinfo{font-size:11.5px;border-radius:99px;padding:3px 11px;background:color-mix(in srgb,var(--good) 13%,var(--panel));color:var(--good-ink);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);white-space:nowrap}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 22px 0}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;gap:9px;padding:7px 11px;font-size:13.5px}
.ctl .lb{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
select{font:inherit;font-size:13.5px;color:var(--ink);background:transparent;border:0;max-width:330px}
.btn{border:0;border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;gap:7px}
.btn.go{background:var(--go)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:500;padding:8px 12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}

.status{display:flex;justify-content:center;margin:14px 22px 0}
.status span{font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:4px 15px;background:color-mix(in srgb,var(--good) 14%,var(--panel));color:var(--good-ink);border:1px solid color-mix(in srgb,var(--good) 32%,transparent)}
.status span.warn{background:color-mix(in srgb,var(--warn) 16%,var(--panel));color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}

.chips{margin:16px 22px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chips .hd{font-size:12px;color:var(--muted);margin-bottom:8px}
.chips .row{display:grid;gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.chips .cell{background:var(--panel);padding:8px 6px;text-align:center;border:0;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.chips .cell .pc{font-size:11px;color:var(--muted)}
.chips .cell .nm{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.chips .cell .ct{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.chips .cell:hover:not(:disabled){background:var(--surface-2)}
.chips .cell:disabled{cursor:default}
.chips .cell[aria-pressed=true]{background:color-mix(in srgb,var(--primary) 12%,var(--panel))}
.chips .cell[aria-pressed=true] .nm{color:var(--primary)}

.wrap{padding:18px 22px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card>h3{font-size:14px}
.capt{font-size:12.5px;color:var(--muted)}
.card>.capt{margin-top:3px}
.grid2{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:16px;align-items:start}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}}
@media (max-width:720px){.wrap,.crumbs,.toolbar,.status{padding-left:14px;padding-right:14px}.chips{margin-left:14px;margin-right:14px}}

.kpis{display:grid;gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:16px}
.kpi{background:var(--panel);padding:12px 14px;min-height:92px;display:flex;flex-direction:column}
.kpi dt{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi dd{margin:4px 0 0;font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.kpi dd small{font-size:11.5px;font-weight:400;color:var(--muted);letter-spacing:0}
.kpi .spark,.kpi .hint{margin-top:auto;padding-top:6px}
.kpi .hint{font-size:11px;color:var(--muted)}

.banner{display:flex;gap:11px;align-items:flex-start;border-radius:10px;padding:12px 14px;font-size:13.5px;border:1px solid;margin-bottom:16px;background:var(--panel)}
.banner .bi{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;flex:none;padding-top:3px}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border-color:color-mix(in srgb,var(--warn) 42%,transparent)}
.banner.warn .bi{color:var(--warn-ink)}
.banner.info{background:color-mix(in srgb,var(--primary) 8%,var(--panel));border-color:color-mix(in srgb,var(--primary) 32%,transparent)}
.banner.info .bi{color:var(--primary)}
.banner.bad{background:color-mix(in srgb,var(--critical) 10%,var(--panel));border-color:color-mix(in srgb,var(--critical) 38%,transparent)}
.banner.bad .bi{color:var(--critical-ink)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg{display:block;width:100%;overflow:visible}
.tick{fill:var(--muted);font-size:11px}
.axis-line{stroke:var(--baseline);stroke-width:1}
.grid-line{stroke:var(--grid);stroke-width:1}
.vlabel{fill:var(--ink);font-size:11.5px;font-weight:600}
.clabel{fill:var(--ink-2);font-size:12px}
.hit{fill:transparent}
#tip{position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 10px 30px -14px rgba(0,0,0,.5);max-width:300px}
#tip b{display:block;color:var(--ink);margin-bottom:3px}
#tip .row{color:var(--ink-2);display:flex;gap:10px;justify-content:space-between}
#tip .row i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

details.tbl{margin-top:12px}
details.tbl summary{font-size:12.5px;color:var(--primary);cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
thead th{font-size:10.5px;color:var(--muted);background:var(--surface-2);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}

.clusters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cl{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cl.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cl-main{display:flex;gap:12px;padding:13px 15px;align-items:flex-start}
.cl-check input{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;margin-top:3px}
.cl-body{flex:1;min-width:0}
.cl-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cl-title .nm{font-weight:600;font-size:14.5px}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.chip.top{background:color-mix(in srgb,var(--s2) 15%,var(--panel));color:var(--s2)}
.chip.weak,.chip.skew{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn-ink)}
.chip.part{background:var(--surface-2);color:var(--ink-2);text-transform:none;letter-spacing:0;font-weight:500}
.cl-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.barrow{display:flex;align-items:center;gap:12px;margin-top:9px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--baseline)}
.cl.rank1 .bar i{background:var(--s1)}
.counts{display:flex;gap:14px;flex:none;font-size:12px;color:var(--muted)}
.counts b{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.note{margin-top:8px;font-size:12.5px;color:var(--ink-2);font-style:italic}
.toggle{background:none;border:0;color:var(--primary);font-size:12.5px;font-weight:500;padding:4px 0;margin-top:6px}
.ex{border-top:1px solid var(--line-2);background:var(--surface-2);padding:12px 15px 14px}
.ex .lb{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.q{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.q .qid{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;padding-top:3px}
.q .qt{flex:1;min-width:0;color:var(--ink)}
.q.moved .qt{text-decoration:line-through;color:var(--muted)}
.q .qa{background:none;border:0;flex:none;font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px;padding:2px 0}
.q .qa:hover{color:var(--s2)}
.selbar{position:sticky;bottom:0;z-index:20;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--page);border-radius:10px;padding:12px 16px}
.selbar .btn.ghost{background:transparent;border-color:rgba(160,160,160,.45);color:inherit}
.ansbox{margin-top:10px;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:9px;background:var(--surface-2);padding:12px 14px}
.ansbox.err{border-left-color:var(--critical)}
.anshd{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.chip.draft{background:color-mix(in srgb,var(--primary) 16%,var(--panel));color:var(--primary)}
.ansf{padding:9px 0;border-top:1px solid var(--line-2)}
.ansf:first-of-type{border-top:0;padding-top:0}
.ansf dt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.ansf dd{margin:4px 0 0;color:var(--ink)}
.ansf dd.capt{margin-top:2px;font-style:italic}
.ansf.hi{background:color-mix(in srgb,var(--primary) 7%,transparent);margin:0 -14px;padding:9px 14px}
.ansf.warn dt{color:var(--warn-ink)}
.faqbox{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--sh-2);animation:riseIn .34s var(--ease-out) both}
.faqbox > h3{font-size:14px}
.faqitem{border-top:1px solid var(--line-2);padding:13px 0}
.faqitem:first-of-type{border-top:0}
.faqitem.off{opacity:.55}
.faqhd{display:flex;gap:10px;align-items:flex-start}
.faqhd input{width:17px;height:17px;accent-color:var(--primary);margin-top:3px;flex:none}
.faqhd .qq{font-weight:600;font-size:14px;flex:1;min-width:0}
.faqans{margin:7px 0 0 27px;color:var(--ink-2);font-size:13.5px}
.faqmeta{margin:7px 0 0 27px;font-size:12px;color:var(--muted)}
.faqmeta b{color:var(--ink-2);font-weight:500}
.faqfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line-2)}
p.verdict{font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--primary);border-radius:9px;padding:13px 15px;margin:0 0 16px;line-height:1.6}
p.notel{font-size:12.5px;color:var(--ink-2);margin:0 0 16px}
.lnk{background:none;border:0;padding:0;color:var(--primary);font-weight:600;font-size:12.5px;cursor:pointer}
.lnk:hover{text-decoration:underline}
code.sl{color:var(--muted);font-size:.85em}

/* ba băng cụm + nhãn chung tách ra khỏi thẻ */
p.common{font-size:12.5px;color:var(--ink-2);margin:0 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.band{margin-bottom:20px}
.band>.bhd,.band>summary>.bhd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;
  padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:11px}
.band>summary{list-style:none;cursor:pointer}
.band>summary::-webkit-details-marker{display:none}
.bnm{font-size:14px;font-weight:600;color:var(--ink)}
.bct{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  border-radius:99px;padding:1px 9px}
.bsub{font-size:12.5px;color:var(--muted);margin-left:auto}
details.band>summary .bnm::before{content:"▸ ";color:var(--muted)}
details.band[open]>summary .bnm::before{content:"▾ "}
/* Phân tầng thị giác giữa ba băng chỉ được chạm vào CHIỀU CAO thanh và cỡ chữ.
   TUYỆT ĐỐI không thu chiều rộng track .bar: bề rộng thanh tính theo % của
   container, thu track lại là cùng một giá trị 8 lượt hiện chênh nhau 4,5 lần
   giữa hai băng — vô hiệu hoá việc maxT đã tính chung trên toàn danh sách. */
.cl.b1 .bar{height:12px}
.cl.b2 .bar{height:9px}
.cl.b3 .bar{height:6px}
.cl.b2 .cl-title .nm{font-size:14px}
.cl.b3 .cl-title .nm{font-size:13.5px;color:var(--ink-2)}
.cl.b3 .cl-main{padding-top:11px;padding-bottom:11px}

/* hàng lọc gọn: một dòng tóm tắt luôn hiện + 4 pill + khối giải nghĩa */
.filterbox>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:baseline;
  font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.filterbox>summary::-webkit-details-marker{display:none}
.filterbox>summary b{color:var(--ink);font-weight:600}
.filterbox .more{margin-left:auto;color:var(--primary);font-weight:600;white-space:nowrap}
.filterbox[open] .more{color:var(--muted)}
.chips .row4{display:flex;gap:8px;flex-wrap:wrap;background:none;border:0;margin-top:11px}
.chips .pill{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;
  font-size:13px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center;
  transition:background .15s var(--ease-out),border-color .15s var(--ease-out)}
.chips .pill:hover{border-color:var(--muted)}
.chips .pill[aria-pressed=true]{background:color-mix(in srgb,var(--primary) 12%,var(--panel));
  border-color:color-mix(in srgb,var(--primary) 42%,transparent);color:var(--primary);font-weight:600}
.chips .pill .n{color:var(--muted);font-weight:600}
.chips .pill[aria-pressed=true] .n{color:var(--primary)}
.gloss{margin-top:11px}
.gloss>summary{font-size:12.5px;color:var(--primary);cursor:pointer}
dl.gl{margin:8px 0 0;font-size:12.5px}
dl.gl dt{font-weight:600;color:var(--ink);margin-top:7px}
dl.gl dd{margin:1px 0 0;color:var(--ink-2)}

/* nếp gấp mới của Tổng quan */
p.trust{font-size:13px;color:var(--ink-2);margin:10px 0 4px;line-height:1.65}
p.trust .num{color:var(--ink);font-weight:600}
h3.sec2{font-size:15px;margin:18px 0 2px}
.todo{list-style:none;margin:10px 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--sh-1)}
.todo .rk{font-size:22px;font-weight:600;color:var(--muted);min-width:22px;line-height:1.1}
.todo .tdbody{flex:1;min-width:0}
.todo .tt{font-weight:600;font-size:14.5px}
.todo .mt{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.todo .toggle{margin-top:7px}
details.proof{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
details.proof>summary{font-size:13.5px;font-weight:600;color:var(--primary);cursor:pointer;list-style:none}
details.proof>summary::-webkit-details-marker{display:none}
details.proof>summary::before{content:"▸ ";display:inline-block;transition:transform .18s var(--ease-out)}
details.proof[open]>summary::before{content:"▾ "}
details.proof>*:not(summary){margin-top:14px}
.enter .todo li{animation:riseIn .38s var(--ease-out) both;animation-delay:calc(var(--d,0) * 40ms)}
.scatter{margin-top:10px;border:1px dashed var(--baseline);border-radius:10px;padding:13px 15px;background:var(--panel)}

.meter{height:10px;border-radius:99px;background:color-mix(in srgb,var(--primary) 14%,var(--surface-2));overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.meter.good i{background:var(--good)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--critical)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin-bottom:16px}
.hero .fig{font-size:50px;font-weight:600;line-height:1.05;letter-spacing:-.03em}
.hero .cap{color:var(--ink-2);margin-top:6px;max-width:62ch}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,var(--panel));color:var(--good-ink)}
.pill.no{background:color-mix(in srgb,var(--critical) 15%,var(--panel));color:var(--critical-ink)}

.live-src{display:flex;flex-direction:column;gap:8px}
.srcbtn{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink)}
.srcbtn:hover{border-color:var(--primary)}
.srcbtn b{display:block;font-size:13.5px;font-weight:600}
.srcbtn em{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-style:normal}
.srcbtn .n{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px}
textarea{width:100%;min-height:210px;font:13px/1.55 var(--mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;resize:vertical}
input[type=text]{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.steps{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.step{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.step .dot{width:19px;height:19px;border-radius:99px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px}
.step.on{color:var(--ink)}
.step.on .dot{border-color:var(--primary);color:var(--primary)}
.step.done{color:var(--ink-2)}
.step.done .dot{border-color:var(--good);background:var(--good);color:#fff}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:99px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.kbd{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}

/* ── trang chủ ─────────────────────────────────────── */
.land{max-width:960px;margin:0 auto;padding:44px 0 20px}
.land .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
.land h1{font-size:clamp(32px,4.6vw,52px);line-height:1.08;letter-spacing:-.035em;margin-top:14px;max-width:16ch}
.land .lede{font-size:17px;line-height:1.62;color:var(--ink-2);max-width:62ch;margin-top:18px}
.land .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.evid{display:grid;gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:38px}
.evid div{background:var(--panel);padding:16px 18px}
.evid b{display:block;font-size:26px;font-weight:600;letter-spacing:-.025em}
.evid span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.sec{max-width:960px;margin:0 auto;padding:46px 0 0}
.sec > .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec > h2{font-size:26px;letter-spacing:-.025em;margin-top:10px}
.sec > .sub{color:var(--ink-2);margin-top:8px;max-width:60ch}
.steps3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:24px}
.step3{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh-1);
  transition:box-shadow .26s var(--ease),transform .26s var(--ease)}
.step3:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.step3 .no{width:27px;height:27px;border-radius:8px;background:color-mix(in srgb,var(--primary) 13%,transparent);
  color:var(--primary);display:grid;place-items:center;font-size:13px;font-weight:700}
.step3 h3{font-size:15.5px;margin-top:13px}
.step3 p{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.55}
.prins{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:24px}
.prin{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh-1);
  border-left:3px solid var(--primary);transition:box-shadow .26s var(--ease),transform .26s var(--ease)}
.prin:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.prin h3{font-size:15.5px;letter-spacing:-.01em}
.prin p{font-size:13.5px;color:var(--ink-2);margin-top:8px;line-height:1.58}
.landfoot{max-width:960px;margin:52px auto 0;padding-top:20px;border-top:1px solid var(--line);
  display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* ── màn đăng nhập ─────────────────────────────────── */
#gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 480px at 50% -10%, color-mix(in srgb,var(--primary) 16%,var(--page)), var(--page))}
#gate .box{width:100%;max-width:396px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:28px;box-shadow:var(--sh-3);animation:riseIn .42s var(--ease-out) both}
#gate .logo{width:38px;height:38px;border-radius:11px;background:var(--topbar);color:#fff;display:grid;
  place-items:center;font-size:18px}
#gate h2{font-size:20px;margin-top:16px;letter-spacing:-.02em}
#gate p{font-size:13.5px;color:var(--ink-2);margin-top:8px;line-height:1.55}
#gate form{margin-top:18px;display:flex;flex-direction:column;gap:10px}
#gate .err{font-size:13px;color:var(--critical-ink);background:color-mix(in srgb,var(--critical) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--critical) 30%,transparent);border-radius:8px;padding:9px 11px}
#gate .fine{font-size:11.5px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);line-height:1.6}
.land,.sec{animation:riseIn .5s var(--ease-out) both}

/* ══════════════════════════════════════════════════════════════════
   LỚP CHUYỂN ĐỘNG & TINH CHỈNH
   Nguyên tắc: chuyển động để giải thích thứ tự và quan hệ, không để trang trí.
   Mọi thứ dưới đây tắt sạch khi người dùng bật "giảm chuyển động".
   ══════════════════════════════════════════════════════════════════ */
:root{
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --sh-1: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --sh-2: 0 2px 4px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.18);
  --sh-3: 0 4px 8px rgba(16,24,40,.05), 0 20px 48px -20px rgba(16,24,40,.28);
}
:root[data-theme="dark"], :root:where(:not([data-theme="light"])){
  --sh-1: 0 1px 2px rgba(0,0,0,.5);
  --sh-2: 0 2px 6px rgba(0,0,0,.45), 0 10px 30px -14px rgba(0,0,0,.7);
  --sh-3: 0 6px 14px rgba(0,0,0,.5), 0 24px 60px -22px rgba(0,0,0,.8);
}

/* thanh trên: nền chuyển sắc nhẹ, viền dưới mảnh */
.topbar{
  background:linear-gradient(103deg, var(--topbar) 0%, color-mix(in srgb, var(--topbar) 78%, #000 8%) 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.06), var(--sh-1);
  position:relative; z-index:60;
}
.topbar .brand .logo{
  background:linear-gradient(140deg, rgba(255,255,255,.34), rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
}
.topbar nav button{transition:background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease)}
.topbar nav button:active{transform:translateY(1px)}
.topbar nav button[aria-current=page]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.topbar .right button{transition:background .18s var(--ease), border-color .18s var(--ease)}
.topbar .right button:hover{background:rgba(255,255,255,.14)}

/* thẻ: nâng nhẹ khi rê chuột, viền sáng dần */
.card,.kpis,.chips,.hero,.cl,.scatter,.ctl,.seg,.ansbox{box-shadow:var(--sh-1)}
.card,.cl,.hero{transition:box-shadow .26s var(--ease), border-color .26s var(--ease), transform .26s var(--ease)}
.card:hover,.hero:hover{box-shadow:var(--sh-2)}
.cl:hover{box-shadow:var(--sh-2); border-color:color-mix(in srgb,var(--primary) 26%,var(--line))}
.cl.on{box-shadow:0 0 0 1px var(--primary), var(--sh-2)}

/* nút */
.btn{transition:transform .16s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease); box-shadow:var(--sh-1)}
.btn:hover:not(:disabled){transform:translateY(-1px); box-shadow:var(--sh-2); filter:saturate(1.08)}
.btn:active:not(:disabled){transform:translateY(0); box-shadow:var(--sh-1)}
.btn.go{background:linear-gradient(180deg, color-mix(in srgb,var(--go) 92%,#fff 8%), var(--go))}
.btn:not(.ghost):not(.go){background:linear-gradient(180deg, color-mix(in srgb,var(--primary) 92%,#fff 8%), var(--primary))}
.toggle{transition:color .16s var(--ease), opacity .16s var(--ease)}
.toggle:hover{opacity:.78}
.seg button{transition:background .18s var(--ease), color .18s var(--ease)}
.chips .cell{transition:background .2s var(--ease), transform .2s var(--ease)}
.chips .cell:hover:not(:disabled){transform:translateY(-1px)}
.srcbtn{transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease)}
.srcbtn:hover{transform:translateY(-1px); box-shadow:var(--sh-2)}

/* hero: nền chuyển sắc rất nhẹ để số dẫn đầu nổi lên */
.hero{
  background:
    radial-gradient(1100px 200px at 0% 0%, color-mix(in srgb,var(--primary) 7%,transparent), transparent 70%),
    var(--panel);
  position:relative; overflow:hidden;
}
.hero .fig{
  background:linear-gradient(180deg, var(--ink) 30%, color-mix(in srgb,var(--ink) 62%,var(--muted)) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.status span{box-shadow:var(--sh-1)}

/* vào màn: mờ dần + trượt lên, so le theo thứ tự đọc */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{100%{background-position:200% 0}}
.enter > *{animation:riseIn .42s var(--ease-out) both; animation-delay:calc(var(--d,0) * 45ms)}
.enter .clusters > li{animation:riseIn .38s var(--ease-out) both; animation-delay:calc(var(--d,0) * 28ms)}
.enter .kpi{animation:riseIn .4s var(--ease-out) both; animation-delay:calc(var(--d,0) * 40ms)}
.enter .chips .cell{animation:riseIn .34s var(--ease-out) both; animation-delay:calc(var(--d,0) * 32ms)}

/* thanh trong cụm và cột biểu đồ: mọc ra từ 0 */
.bar i{transition:width .62s var(--ease-out)}
svg rect[data-grow]{transition:width .7s var(--ease-out), height .7s var(--ease-out), y .7s var(--ease-out)}
svg text{transition:opacity .4s var(--ease)}

/* khung câu nguyên văn mở ra */
.ex{animation:riseIn .3s var(--ease-out) both}
.ansbox{animation:riseIn .34s var(--ease-out) both}

/* khung xương khi đang chờ AI */
.skel{border-radius:7px;background:linear-gradient(90deg,
  var(--surface-2) 0%, color-mix(in srgb,var(--line) 70%,var(--surface-2)) 50%, var(--surface-2) 100%);
  background-size:200% 100%; animation:shimmer 1.4s linear infinite; height:13px; margin:9px 0}
.skel.w70{width:70%} .skel.w45{width:45%} .skel.w90{width:90%}
.skel.tall{height:22px}

/* thanh chọn cụm trượt lên */
.selbar{animation:riseIn .3s var(--ease-out) both; box-shadow:var(--sh-3)}

/* tooltip mượt hơn */
#tip{transition:opacity .14s var(--ease), transform .14s var(--ease); transform:translateY(3px); box-shadow:var(--sh-3)}
#tip[style*="opacity: 1"]{transform:none}

/* chip có nhịp khi là thứ đáng chú ý */
.chip.top{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--s2) 30%,transparent)}
.chip.skew{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 34%,transparent)}
.chip.draft{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 32%,transparent)}

/* thanh cuộn gọn */
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 34%,transparent);border-radius:99px;border:3px solid var(--page)}
.main::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 52%,transparent)}
.main::-webkit-scrollbar-track{background:transparent}

/* ══════════════════════════════════════════════════════════════════
   NỀN MÔI TRƯỜNG — dán vào CUỐI <style>, NGAY TRƯỚC khối
   @media (prefers-reduced-motion:reduce) hiện có ở dòng 404.
   Toàn bộ là append-only, trừ 2 dòng ghi đè có chú thích bên dưới.
   ══════════════════════════════════════════════════════════════════ */

/* 1 ─ Token CHỈ dùng cho nền. Không đụng bảng màu dữ liệu --s1/--s2/--s3
       (đã kiểm mù màu) và tuyệt đối không mượn --s2 (cam = chuỗi "Người hỏi")
       hay --critical (đỏ = cụm hỏng) làm màu nền. */
:root{
  --dot:rgba(11,11,11,.055);
  --glow-1:rgba(37,99,235,.07);
  --glow-2:rgba(27,175,122,.05);
  --floor:rgba(37,99,235,.05);
}
/* --page:#0d0d0d gần như đen tuyệt đối → cùng một cường độ sẽ biến mất.
   Phải khai ở CẢ HAI khối tối, đúng selector sản phẩm đang dùng. */
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    --dot:rgba(255,255,255,.045);
    --glow-1:rgba(57,135,229,.10);
    --glow-2:rgba(25,158,112,.07);
    --floor:rgba(57,135,229,.07);
  }
}
:root[data-theme="dark"]{
  --dot:rgba(255,255,255,.045);
  --glow-1:rgba(57,135,229,.10);
  --glow-2:rgba(25,158,112,.07);
  --floor:rgba(57,135,229,.07);
}

/* 2 ─ CHỐT CHẶN. .main là hộp cuộn và đang sơn --page đục (dòng 73);
       không cho nó trong suốt thì mọi thứ dưới đây vô hình. */
.main{background:transparent}
.app{position:relative;z-index:1}
/* .app thành stacking context mới, nhưng .topbar(z:60) và .selbar(z:20) nằm
   TRONG .app nên thứ tự nội bộ giữ nguyên; #tip(z:90) và #gate(z:200) là anh em
   của .app ở cấp body với z lớn hơn 1 nên vẫn nằm trên. */

/* 3 ─ Dải "chân trời" ở đáy khung hình. body KHÔNG cuộn (.app khoá 100vh)
       nên background-position:bottom neo vĩnh viễn ở đáy viewport, raster
       đúng MỘT lần, 0 repaint khi cuộn. Ghi đè phần background của dòng 50,
       giữ nguyên margin/color/font ở đó. */
body{
  background-color:var(--page);
  background-image:linear-gradient(0deg, var(--floor) 0, transparent 360px);
  background-repeat:no-repeat;
  background-position:left bottom;
  background-size:100% 360px;
}

/* 4 ─ Lớp trang trí, nằm dưới .app. contain:strict hứa với trình duyệt là
       không có gì trong này ảnh hưởng ra ngoài, nên nó không phải kiểm lại
       layout của trang mỗi lần ta đổi transform. */
#bgfx{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  contain:strict;
  transition:opacity .45s var(--ease-out);
}
#bgfx i{position:absolute;display:block;left:0;right:0}

/* 4a ─ THỊ SAI. Lưới điểm ở hai lề, trôi LÊN chậm hơn nội dung khi cuộn xuống —
        nội dung đi 1000px thì lớp này đi 90px, tỉ lệ 11:1 nên mắt đọc ra là "ở
        xa hơn" chứ không đọc ra là "có vật đang chạy".

        Bề rộng dải CO GIÃN: --gut = nửa phần thừa của màn hình sau khi trừ cột
        nội dung 1280px, trừ tiếp 18px cho chắc. Trên màn 1920 được 302px; trên
        laptop trường 1366×768 chỉ còn 25px nên hoạ tiết tự teo về gần hết chứ
        KHÔNG BAO GIỜ lấn vào chữ. Đây là chốt chặn vòng soi hiệu năng nêu ra:
        dải 190px cố định sẽ ăn 147px vào trong cột chữ ở 1366px.

        top/bottom âm 1 chu kỳ hoạ tiết (24px) × biên độ tối đa, để khi dịch lên
        vẫn không hở mép. */
#bgfx .l1{
  top:-160px;bottom:-160px;
  --gut:max(0px, (100vw - 1280px)/2 - 18px);
  background-image:radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.6px);
  background-size:24px 24px;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(var(--gut) * .55),
                     transparent var(--gut),transparent calc(100% - var(--gut)),
                     #000 calc(100% - var(--gut) * .55),#000 100%);
          mask-image:linear-gradient(90deg,#000 0,#000 calc(var(--gut) * .55),
                     transparent var(--gut),transparent calc(100% - var(--gut)),
                     #000 calc(100% - var(--gut) * .55),#000 100%);
  will-change:transform;
}

/* 4b ─ ĐỔI THEO ĐỘ SÂU. Lớp ánh sáng phủ cả màn hình. Nó KHÔNG có thị sai —
        trường lớn nhất mà trượt theo cuộn chính là công thức gây chóng mặt.
        Thay vào đó JS chỉ đổi opacity theo % trang đã đọc, nên cảm giác là
        "đang đi sâu vào trang", không phải "có vật trôi qua".

        Lồng hai lớp: .l2 nhận transform từ JS, <b> bên trong giữ animation theo
        thời gian. Một phần tử không thể vừa chạy @keyframes transform vừa nhận
        transform từ JS — keyframe sẽ đè mất. */
#bgfx .l2{top:0;bottom:0;will-change:opacity}
#bgfx .l2 > b{
  position:absolute;inset:-14%;display:block;
  background-image:
    radial-gradient(760px 540px at 16% 4%,  var(--glow-1), transparent 62%),
    radial-gradient(660px 480px at 90% 28%, var(--glow-2), transparent 60%);
  animation:ambDrift 74s cubic-bezier(.45,0,.55,1) infinite,
            ambBreathe 113s ease-in-out infinite;
  will-change:transform,opacity;
}
/* Biên độ 2,6% trên lớp rộng ~1,28×viewport ≈ 38px, đi hết trong 37s ≈ 1px/giây
   — dưới ngưỡng thị giác ngoại vi báo "có gì vừa động". 0% và 100% giống hệt
   nhau nên vòng lặp khép kín. Hai animation chạm hai thuộc tính khác nhau nên
   cộng chu kỳ: 74 × 113 = 8362s ≈ 2h20 mới lặp lại đúng trạng thái. */
@keyframes ambDrift{
  0%,100%{transform:translate3d(-1.2%,.8%,0) scale(1)}
  50%    {transform:translate3d(1.4%,-1.1%,0) scale(1.055)}
}
@keyframes ambBreathe{
  0%,100%{opacity:.62}
  50%    {opacity:.92}
}

/* 5 ─ RÀO CHẮN. Hoạ tiết SỐNG Ở TẦNG DƯỚI .app; thẻ luôn đục.
       Không bao giờ thêm opacity/backdrop-filter cho các lớp dưới đây:
       bảng màu CVD được kiểm trên nền --panel đặc, và backdrop-filter bên trong
       .main = raster lại vùng phía sau mỗi khung hình khi cuộn. */
.card,.kpi,.chips,.chips .cell,.hero,.cl,.ansbox,.scatter,.ctl,.seg,.step3,.prin,.evid div{
  background-color:var(--panel);
  backdrop-filter:none;
}
.kpis,.chips .row,.evid{background-color:var(--line-2)}  /* màu khe lưới, giữ nguyên */

/* 6 ─ Vá tương phản đi kèm (độc lập với hoạ tiết): --muted trên --page chỉ đạt
       2,96:1 ở nền sáng, dưới ngưỡng AA 4,5:1 cho chữ 13,5px. Đây là hai chỗ
       DUY NHẤT có chữ nằm trực tiếp trên nền trang. --ink-2 cho 7,3:1. */
.crumbs{color:var(--ink-2)}
.landfoot{color:var(--ink-2)}

/* 7 ─ In: nền trang trí không đi vào bản PDF nộp giám khảo */
@media print{ #bgfx{display:none} body{background:#fff} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
  .enter > *,.enter .kpi,.enter .clusters > li,.enter .chips .cell{animation:none}
}

@media (prefers-reduced-motion:reduce){
  /* nền: GIỮ hoạ tiết, bỏ chuyển động, khoá về đúng trạng thái nghỉ.
     Không khai gì thì luật *::after{animation-duration:.01ms} ở trên sẽ ném lớp
     này tới keyframe cuối, tức đứng im ở scale(1.055) lệch tâm. */
  /* giữ hoạ tiết, bỏ hết chuyển động, khoá về đúng trạng thái nghỉ. Không khai
     gì thì luật *::before/after{animation-duration:.01ms} ở trên sẽ ném lớp này
     tới keyframe cuối, tức đứng im ở scale(1.055) lệch tâm. */
  #bgfx .l1{transform:none!important;will-change:auto!important}
  #bgfx .l2{opacity:1!important;transform:none!important;will-change:auto!important}
  #bgfx .l2 > b{
    animation:none!important;transform:none!important;
    opacity:.7!important;will-change:auto!important;
  }
  /* spinner: giành lại khỏi luật * ở trên (.spin có specificity 0,1,0 > 0,0,0).
     Đây là tín hiệu "đang gọi AI thật" ở tab Thử trực tiếp — tắt nó đi là người
     bật giảm chuyển động mất hoàn toàn phản hồi và sẽ bấm gọi lần hai. */
  .spin{animation:sp 2.4s linear infinite!important}
  /* các selector so le mới thêm ở kế hoạch thi công */
  .enter .step3,.enter .prin,.enter .evid > div,.enter .todo li,
  .enter .bandwrap .clusters > li{animation:none!important}
}

/* ══ CẤM DÙNG — ba bẫy đã bị loại, ghi lại để không ai thêm vào sau ══
   ✗ .main{background-attachment:fixed}      → .main LÀ hộp cuộn, vẽ lại mỗi khung hình
   ✗ @keyframes{to{background-position:…}}   → paint lại toàn lớp mỗi khung hình
   ✗ @keyframes{to{filter:blur(…)}}          → raster lại lớp toàn khung hình
   ✗ .card{backdrop-filter:blur(…)}          → raster lại vùng sau thẻ mỗi khung cuộn
   ✗ will-change rải lên .card/.cl           → 19+ texture, hết bộ nhớ GPU máy yếu   ══ */

<script>
(function(){
"use strict";
var D = window.CP_DATA || {sessions:[],eval:null,calls:[],thresholds:{}};
var TH = D.thresholds || {};
var css = function(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
var fmt = function(n){ return (n==null?"—":String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")); };
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };

var TABS = [
  {k:"home", label:"Trang chủ",     rail:"Trang chủ",  ic:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'},

];

var state = { sess:0, sort:"turns", filter:"all", evalKind:"cluster", open:{}, sel:{}, moved:{}, det:{}, logKind:"" };
// Nội dung ôn do AI soạn, theo từng cụm. serverUp = có máy chủ cục bộ để gọi AI không.
var answers = {}, serverUp = null;
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var tip = document.getElementById("tip");
function showTip(e,html){ tip.innerHTML=html; tip.style.opacity=1;
  var r=tip.getBoundingClientRect(), x=e.clientX+14, y=e.clientY+14;
  if(x+r.width>innerWidth-8) x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-8) y=e.clientY-r.height-14;
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.style.opacity=0; }

var NS="http://www.w3.org/2000/svg";
function el(t,a){ var n=document.createElementNS(NS,t); for(var k in a){ if(a[k]!=null) n.setAttribute(k,a[k]); } return n; }
function txt(n,s){ n.textContent=s; return n; }
function niceMax(v){ if(v<=0) return 1; var p=Math.pow(10,Math.floor(Math.log10(v))); var s=v/p;
  var m = s<=1?1 : s<=2?2 : s<=2.5?2.5 : s<=5?5 : 10; return m*p; }
function ticks(max){
  var n=1;
  if(max<=1) n=1; else if(max<=4) n=max;
  else { n=[5,4,3,2].filter(function(k){ return max%k===0; })[0]||4; }
  var out=[]; for(var i=0;i<=n;i++) out.push(i/n); return out;
}

function groupedBars(host, rows, opts){
  if(!host) return;
  host.textContent="";
  if(!rows.length){ host.innerHTML='<p class="capt">Không có dữ liệu để vẽ.</p>'; return; }
  opts=opts||{};
  var single=!!opts.single, LW=opts.labelW||230, R=52, PT=8, ROW=single?30:44, BAR=13, GAP=2, W=800;
  var H=PT+rows.length*ROW+26;
  // opts.max: khi một bảng dữ liệu bị vẽ làm HAI biểu đồ (đầu + đuôi gập), cả hai
  // bắt buộc dùng chung một thang. Không thì cụm 10 lượt ở đuôi sẽ vẽ dài ngang cụm 51 lượt.
  var max=opts.max||niceMax(Math.max.apply(null,rows.map(function(r){return single?(r.a||0):Math.max(r.a||0,r.b||0);})));
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":opts.alt||""});
  var PW=W-LW-R, x=function(v){ return LW+(v/max)*PW; };
  ticks(max).forEach(function(f){
    var gx=x(max*f);
    svg.appendChild(el("line",{x1:gx,y1:PT,x2:gx,y2:PT+rows.length*ROW,class:"grid-line"}));
    svg.appendChild(txt(el("text",{x:gx,y:H-8,class:"tick","text-anchor":"middle"}),fmt(Math.round(max*f))));
  });
  svg.appendChild(el("line",{x1:LW,y1:PT,x2:LW,y2:PT+rows.length*ROW,class:"axis-line"}));
  var A=opts.aLabel||"Lượt hỏi", B=opts.bLabel||"Người hỏi";
  rows.forEach(function(r,i){
    var top=PT+i*ROW+4, nm=r.label.length>32?r.label.slice(0,31)+"…":r.label;
    svg.appendChild(txt(el("text",{x:LW-10,y:top+(single?BAR-1:BAR+1),class:"clabel","text-anchor":"end"}),nm));
    (single?[["a",css("--s1"),0]]:[["a",css("--s1"),0],["b",css("--s2"),BAR+GAP]]).forEach(function(s){
      var v=r[s[0]]||0, w=Math.max(2,x(v)-LW);
      if(v>0){
        svg.appendChild(el("rect",{x:LW,y:top+s[2],width:w,height:BAR,rx:4,fill:s[1],"data-grow":"1"}));
        if(w>4) svg.appendChild(el("rect",{x:LW,y:top+s[2],width:4,height:BAR,fill:s[1]}));
      }
      svg.appendChild(txt(el("text",{x:LW+(v>0?w:0)+6,y:top+s[2]+BAR-2,class:"vlabel",opacity:v>0?1:.45}),String(v)));
    });
    var hit=el("rect",{x:0,y:PT+i*ROW,width:W,height:ROW,class:"hit"});
    hit.addEventListener("mousemove",function(e){ showTip(e,"<b>"+esc(r.label)+"</b>"+
      '<div class="row"><span><i style="background:'+css("--s1")+'"></i>'+esc(A)+"</span><span>"+(r.a||0)+"</span></div>"+
      (single?"":'<div class="row"><span><i style="background:'+css("--s2")+'"></i>'+esc(B)+"</span><span>"+(r.b||0)+"</span></div>")+
      (r.extra?'<div class="row"><span>'+esc(r.extra)+"</span></div>":"")); });
    hit.addEventListener("mouseleave",hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

function stackedBar(host, segs){
  if(!host) return;
  host.textContent="";
  var total=segs.reduce(function(s,x){return s+x.v;},0)||1, H=62, W=800, GAP=2, y=8, h=22, cx=0;
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Thành phần lượt hỏi"});
  segs.forEach(function(s,i){
    var w=Math.max(1,(s.v/total)*W-(i<segs.length-1?GAP:0)), pct=Math.round(s.v/total*100);
    svg.appendChild(el("rect",{x:cx,y:y,width:w,height:h,rx:(i===0||i===segs.length-1)?4:0,fill:s.c,"data-grow":"1"}));
    if(w>92) svg.appendChild(txt(el("text",{x:cx+w/2,y:y+h+18,class:"tick","text-anchor":"middle"}),
      s.label+" · "+fmt(s.v)+" ("+pct+"%)"));
    var hit=el("rect",{x:cx,y:0,width:w,height:H,class:"hit"});
    hit.addEventListener("mousemove",function(e){ showTip(e,"<b>"+esc(s.label)+"</b>"+
      '<div class="row"><span>Lượt</span><span>'+fmt(s.v)+" ("+pct+"%)</span></div>"); });
    hit.addEventListener("mouseleave",hideTip);
    svg.appendChild(hit); cx+=w+GAP;
  });
  host.appendChild(svg);
}

function columns(host, bins, alt){
  if(!host) return;
  host.textContent="";
  var W=800,H=180,L=36,B=34,T=10,R=6;
  var max=niceMax(Math.max.apply(null,bins.map(function(b){return b.count;})));
  var pw=(W-L-R)/bins.length, bw=Math.min(44,pw-16);
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H,role:"img","aria-label":alt||""});
  (max<=2?[0,1]:[0,.5,1]).forEach(function(f){
    var gy=T+(1-f)*(H-T-B);
    svg.appendChild(el("line",{x1:L,y1:gy,x2:W-R,y2:gy,class:"grid-line"}));
    svg.appendChild(txt(el("text",{x:L-7,y:gy+4,class:"tick","text-anchor":"end"}),fmt(Math.round(max*f))));
  });
  bins.forEach(function(b,i){
    var h=(b.count/max)*(H-T-B), x=L+i*pw+(pw-bw)/2, y=T+(H-T-B)-h;
    if(b.count>0) svg.appendChild(el("rect",{x:x,y:y,width:bw,height:Math.max(h,2),rx:4,fill:css("--s1")}));
    svg.appendChild(txt(el("text",{x:x+bw/2,y:H-14,class:"tick","text-anchor":"middle"}),b.label));
    var hit=el("rect",{x:L+i*pw,y:0,width:pw,height:H,class:"hit"});
    hit.addEventListener("mousemove",function(e){ showTip(e,"<b>"+esc(b.label)+"</b>"+
      '<div class="row"><span>Số học viên</span><span>'+b.count+"</span></div>"); });
    hit.addEventListener("mouseleave",hideTip);
    svg.appendChild(hit);
  });
  svg.appendChild(el("line",{x1:L,y1:T+(H-T-B),x2:W-R,y2:T+(H-T-B),class:"axis-line"}));
  host.appendChild(svg);
}

function sparkBars(vals,color){
  if(!vals.length) return "";
  var max=Math.max.apply(null,vals)||1, W=150,H=22,g=2;
  var bw=Math.max(2,(W-(vals.length-1)*g)/vals.length);
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="height:22px" aria-hidden="true">';
  vals.forEach(function(v,i){ var h=Math.max(2,v/max*H);
    s+='<rect x="'+(i*(bw+g)).toFixed(1)+'" y="'+(H-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
       '" rx="1.5" fill="'+color+'" opacity="'+(0.35+0.65*v/max).toFixed(2)+'"/>'; });
  return s+"</svg>";
}

/* ─── hạ tầng chuyển động ───────────────────────────────────────────
   Chỉ chạy khi NỘI DUNG THAY ĐỔI THẬT (đổi tab, đổi buổi, đổi bộ lọc),
   không chạy lại mỗi lần bấm một nút nhỏ — nếu không trang sẽ nhấp nháy liên tục.  */
var MOTION_OK = !matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ══════════ NỀN BÁM THEO CUỘN ══════════
   Cái bẫy lớn nhất ở trang này: `window` KHÔNG cuộn. `.app` khoá
   height:100vh;overflow:hidden và hộp cuộn thật là `.main` (id="main").
   Bắt scroll trên window thì không bao giờ nổ.

   Ba luật, vi phạm cái nào cũng làm cuộn giật trên laptop yếu:
   1. Listener {passive:true} — không thì trình duyệt phải đợi xem handler có
      gọi preventDefault() không rồi mới được cuộn.
   2. Gộp vào ĐÚNG MỘT requestAnimationFrame mỗi khung hình. Sự kiện scroll bắn
      dày hơn khung hình rất nhiều.
   3. ĐỌC hết layout trước, GHI style sau. Đọc-ghi xen kẽ buộc trình duyệt tính
      lại layout đồng bộ ngay giữa khung hình.

   Mỗi khung hình ghi đúng 2 thuộc tính, cả hai đều chạy trên compositor
   (transform, opacity) nên không có paint lại, không có layout lại.

   CỐ Ý không làm mượt (không lerp, không quán tính): ánh xạ là hàm thuần tuý
   của scrollTop, nên cuộn ngược lên là nền đổi chiều ngay trong cùng khung
   hình đó, không trượt quá, không nảy. Giật khi đổi chiều là triệu chứng của
   làm mượt chứ không phải của đổi chiều. */
var bgScroll = (function(){
  var box=null, l1=null, l2=null, host=null, tick=false;
  var RATE=0.09;        // lưới điểm đi 90px khi nội dung đi 1000px
  var DEPTH_MIN=0.55;   // độ mờ lớp sáng ở đỉnh trang
  var DEPTH_MAX=1.00;   // ở đáy trang

  function frame(){
    tick=false;
    if(!host) return;
    // đọc — cả hai lần đọc nằm liền nhau, trước mọi lần ghi
    var y=host.scrollTop, span=host.scrollHeight-host.clientHeight;
    // ghi
    l1.style.transform="translate3d(0,"+(-y*RATE).toFixed(1)+"px,0)";
    var p=span>0 ? Math.min(1,y/span) : 0;
    l2.style.opacity=(DEPTH_MIN+(DEPTH_MAX-DEPTH_MIN)*p).toFixed(3);
  }
  function onScroll(){ if(tick) return; tick=true; requestAnimationFrame(frame); }

  return {
    attach:function(){
      box=document.getElementById("bgfx");
      if(!box) return;
      l1=box.querySelector(".l1"); l2=box.querySelector(".l2");
      if(!MOTION_OK) return;          // giảm chuyển động: không gắn listener nào
      host=document.getElementById("main");
      if(!host) return;
      host.addEventListener("scroll", onScroll, {passive:true});
      addEventListener("resize", onScroll, {passive:true});
      frame();
    },
    /* Đổi tab thì show() đã đặt scrollTop=0, nhưng nếu tab trước cũng đang ở
       đỉnh thì KHÔNG có sự kiện scroll nào bắn ra — nền sẽ giữ độ sâu của
       trang cũ. Phải đo lại tường minh. */
    resync:function(){ if(host) onScroll(); }
  };
})();
function playEnter(host){
  if(!MOTION_OK || !host) return;
  host.classList.remove("enter");
  void host.offsetWidth;                       // ép trình duyệt vẽ lại để animation chạy lần nữa
  host.classList.add("enter");
  var i=0;
  Array.prototype.forEach.call(host.children, function(el){ el.style.setProperty("--d", i++); });
  [".kpi",".clusters > li",".chips .cell",".todo li"].forEach(function(sel){
    var j=0;
    Array.prototype.forEach.call(host.querySelectorAll(sel), function(el){ el.style.setProperty("--d", j++); });
  });
}
/* CỐ Ý KHÔNG có hiệu ứng "đếm số lên".
   Nó animate CHÍNH GIÁ TRỊ đang hiển thị, nên nếu requestAnimationFrame bị bóp
   (tab chạy nền, máy yếu, người dùng chuyển tab giữa chừng) thì con số đứng lại ở
   giá trị sai — màn hình báo 509 trong khi sự thật là 511. Sản phẩm này có nguyên
   tắc "mọi con số đếm tay kiểm lại được", nên một hiệu ứng có thể hiện số sai thì
   không đáng đánh đổi. Chuyển động chỉ áp cho HÌNH HỌC (thanh mọc ra, thẻ trượt vào),
   không bao giờ áp cho con số.  */
function growBars(host){

function cur(){ return D.sessions[state.sess] || null; }
function movedKey(){ return "cp.moved."+(cur()?cur().key:"_"); }
function movedSet(){
  var k=cur()?cur().key:"_";
  if(!state.moved[k]) state.moved[k]=lsGet(movedKey(),{})||{};
  return state.moved[k];
}
function saveMoved(){ lsSet(movedKey(), movedSet()); }

function liveClusters(){
  var s=cur(); if(!s) return [];
  var mv=movedSet();
  return s.clusters.map(function(c,i){
    var pk=c.people_key||[], kept=[], keys=[];
    c.turn_ids.forEach(function(t,j){ if(!mv[t]){ kept.push(t); if(pk[j]!=null) keys.push(pk[j]); } });
    var removed=c.turn_ids.length-kept.length;
    if(!removed) return Object.assign({},c,{_i:i,_removed:0});
    var cnt={}, top=0;
    keys.forEach(function(k){ cnt[k]=(cnt[k]||0)+1; if(cnt[k]>top) top=cnt[k]; });
    var people=Object.keys(cnt).length, exact=pk.length===c.turn_ids.length;
    return Object.assign({},c,{
      _i:i,_removed:removed,turns:kept.length,
      people: exact?people:c.people, _approx:!exact,
      weak: exact ? people<=(TH.weak_max_people||2) : c.weak,
      skew: exact ? (kept.length>=(TH.skew_min_turns||4) && top/kept.length>=(TH.skew_ratio||.5)) : c.skew,
      skew_top_share: exact&&kept.length ? Math.round(top/kept.length*100)/100 : c.skew_top_share
    });
  });
}
function sortedClusters(){
  var a=liveClusters().slice();
  a.sort(function(x,y){
    if(!!x.weak !== !!y.weak) return x.weak?1:-1;
    if((x.turns===0) !== (y.turns===0)) return x.turns===0?1:-1;
    return state.sort==="people" ? (y.people-x.people)||(y.turns-x.turns)
                                 : (y.turns-x.turns)||(y.people-x.people); });
  return a;
}
function filtered(){
  var a=sortedClusters();
  if(state.filter==="strong") return a.filter(function(c){ return !c.weak; });
  if(state.filter==="weak")   return a.filter(function(c){ return c.weak; });
  if(state.filter==="skew")   return a.filter(function(c){ return c.skew; });
  if(state.filter==="top")    return a.slice(0,1);
  return a;
}
function scatterCount(){ var s=cur(); if(!s) return 0;
  var n=0, mv=movedSet(); for(var k in mv) if(mv[k]) n++;
  return s.scatter.turns+n; }

function sessionsByDate(){
  /* Sắp theo first_day — ngày câu hỏi ĐẦU TIÊN về buổi đó, tức lúc buổi diễn ra.
     KHÔNG dùng last_day: học viên vẫn hỏi về buổi cũ sau khi buổi mới đã dạy,
     nên D04 (DAY03) và D08 (DAY04) đều có câu hỏi tới 15/09 trong khi D10 (Day06)
     dừng ở 14/09 — sắp theo câu hỏi cuối sẽ nói DAY03 mới hơn Day06. */
  return (D.sessions||[]).slice().sort(function(a,b){
    var da=a.first_day||"", db=b.first_day||"";
    if(da&&db&&da!==db) return db.localeCompare(da);
    if(da&&!db) return -1;
    if(db&&!da) return 1;
    return String(b.lecture||"").localeCompare(String(a.lecture||""), undefined, {numeric:true});
  });
}

function bootAuth(){
  // Mở bằng file:// thì không có máy chủ nên không có cổng đăng nhập —
  // dữ liệu lúc đó nằm sẵn trên ổ đĩa của chính người mở.
  return fetch("/api/session").then(function(r){ return r.json(); })

/* SVG nằm trong <details> đóng đo được bề rộng 0 nên vẽ ra sẽ méo.
   Vẽ lười: đang mở thì vẽ ngay, đang đóng thì đợi lần mở đầu tiên. */
function drawLazy(detId, draw){
  var d=document.querySelector('[data-det="'+detId+'"]');
  if(!d) return;
  /* Đang mở sẵn thì chỉ vẽ, KHÔNG gọi growBars ở đây: animate() ngay sau đó sẽ
     chạy growBars trên cả panel. Gọi hai lần thì lần sau đọc đúng bề rộng lần
     trước vừa set về 0, rồi "khôi phục" về 0 — thanh cụt vĩnh viễn.
     Chỉ tự chạy growBars khi người dùng bấm mở, vì lúc đó animate() không chạy. */
  if(d.open){ draw(); return; }
  d.addEventListener("toggle", function once(){
    if(!d.open) return;
    d.removeEventListener("toggle", once);
    draw(); growBars(d);
  });
}

/* ══════════ CỤM VẤN ĐỀ ══════════ */
/* Cùng một bài giảng xuất hiện hai kiểu trong dữ liệu: bản có dấu
   "Day03: Từ chatbot đến agentic agent react (Mr. [HV])" và bản slug
   "day03-tu-chatbot-den-agentic-agent-react". In cả hai lên cùng một thẻ là
   nói một chuyện hai lần. Chuẩn hoá về cùng một khoá rồi giữ bản người đọc được. */
function partKey(p){
  return String(p||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/đ/g,"d")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function dedupeParts(parts){
  var out=[];
  (parts||[]).forEach(function(p){
    var k=partKey(p);
    if(!k) return;
    for(var i=0;i<out.length;i++){
      var ok=partKey(out[i]);
      if(ok===k || (ok.length>=12 && k.length>=12 && (ok.indexOf(k)===0 || k.indexOf(ok)===0))){
        /* giữ bản dễ đọc hơn: bản có khoảng trắng/chữ hoa, không phải slug */
        if(/[ A-Z]/.test(p) && !/[ A-Z]/.test(out[i])) out[i]=p;
        return;
      }
    }
    out.push(p);
  });
  return out;
}
/* Nhãn nào có mặt ở quá nửa số cụm thì không phân biệt được gì giữa các cụm —
   nói một lần ở đầu danh sách, đừng lặp 16 lần. */
function commonParts(cls){
  var n=cls.length; if(n<4) return {};
  var cnt={}, label={};
  cls.forEach(function(c){
    var seen={};
    dedupeParts(c.parts).forEach(function(p){
      var k=partKey(p); if(seen[k]) return; seen[k]=1;
      cnt[k]=(cnt[k]||0)+1; if(!label[k]||/[ A-Z]/.test(p)) label[k]=p;
    });
  });
  var out={};
  Object.keys(cnt).forEach(function(k){ if(cnt[k]/n>0.5) out[k]=label[k]; });
  return out;
}

  if(!s){ host.innerHTML=emptyState(); return; }
  var cls=filtered(), mv=movedSet(), h="";
  if(s.sparse) h+='<div class="banner warn"><span class="bi">QUÁ ÍT CÂU</span><span>'+esc(s.sparse_reason)+"</span></div>";

  var nmoved=Object.keys(mv).filter(function(k){return mv[k];}).length;
  h+='<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px">'+
     "<h2 style='font-size:15px'>"+cls.length+" cụm · xếp theo "+(state.sort==="people"?"số người hỏi":"số lượt hỏi")+
     (state.filter!=="all"?" · đang lọc":"")+"</h2>"+
     '<span class="capt">Mở một cụm để đọc câu nguyên văn · bấm “Không thuộc cụm” để sửa bằng tay'+
     (nmoved?' · <b>'+nmoved+" câu đã sửa</b>":"")+"</span></div>";

  /* maxT tính trên TOÀN BỘ cụm của buổi, không phải trên danh sách đã lọc.
     Nếu tính trên danh sách lọc thì cụm 6 lượt sẽ vẽ hết chiều rộng khi đang lọc
     "Cụm yếu" — cùng một giá trị hiện dài ngắn khác nhau tuỳ bộ lọc, tức thanh
     đang đo THỨ HẠNG chứ không đo SỐ LƯỢT. */
  var maxT=Math.max.apply(null,sortedClusters().map(function(x){return x.turns;}).concat([1]));
  var common=commonParts(cls), commonKeys=Object.keys(common);
  if(commonKeys.length){
    h+='<p class="common">Mọi cụm dưới đây đều thuộc '+
       commonKeys.map(function(k){return '<span class="chip part">'+esc(common[k])+"</span>";}).join(" ")+
       ' — bên trong mỗi cụm chỉ còn nhãn khác nhau.</p>';
  }

  /* Ba băng theo SỐ NGƯỜI, vì đó là thứ quyết định "cả lớp kẹt" hay "một bạn
     hỏi nhiều". Ngưỡng in thẳng lên màn hình để kiểm tay được bằng cột số
     người, và đọc từ TH chứ không gõ cứng. Tên băng MÔ TẢ, không khuyên —
     nguyên tắc số 6 của sản phẩm nói hệ thống đưa vật liệu, không khuyến nghị. */
  var wmax=TH.weak_max_people||2;
  var big=Math.max(wmax+1, Math.ceil((s.students||0)*0.1));
  var bands=[
    {k:"b1", nm:"Từ "+big+" học viên trở lên cùng hỏi",
     sub:"Đủ đông để đáng dành thời gian trên lớp.",
     rows:cls.filter(function(c){return !c.weak && c.people>=big;})},
    {k:"b2", nm:"Từ "+(wmax+1)+" đến "+(big-1)+" học viên",
     sub:"Có thật nhưng chưa phải cả lớp — cân nhắc gộp vào phần khác.",
     rows:cls.filter(function(c){return !c.weak && c.people<big;})},
    {k:"b3", nm:"Cụm yếu — "+wmax+" người trở xuống",
     sub:"Chưa đủ căn cứ để kết luận cả lớp kẹt. Vẫn hiện đủ, không xoá.",
     rows:cls.filter(function(c){return c.weak;})}
  ];

  function cardHtml(c, rank, band){
    var id=s.key+"#"+c._i, open=state.open[id], sel=state.sel[id];
    var first=(rank===0&&band==="b1"&&!s.sparse&&state.filter==="all");
    var parts=dedupeParts(c.parts).filter(function(p){ return !common[partKey(p)]; });
    var o='<li class="cl '+band+(first?" rank1":"")+(sel?" on":"")+'"><div class="cl-main">'+
       '<div class="cl-check"><input type="checkbox" data-sel="'+esc(id)+'"'+(sel?" checked":"")+
       ' aria-label="Chọn cụm '+esc(c.name)+'"></div><div class="cl-body">'+
       '<div class="cl-title"><span class="nm">'+esc(c.name)+"</span>"+
       (first?'<span class="chip top">đông nhất</span>':"")+
       (c.skew?'<span class="chip skew">tín hiệu lệch</span>':"")+
       (c.weak?'<span class="chip weak">cụm yếu</span>':"")+"</div>";
    if(parts.length) o+='<div class="cl-meta">'+
         parts.map(function(p){return '<span class="chip part">'+esc(p)+"</span>";}).join("")+"</div>";
    o+='<div class="barrow"><div class="bar"><i style="width:'+Math.max(3,Math.round(c.turns/maxT*100))+'%"></i></div>'+
       '<div class="counts"><span><b>'+c.turns+"</b> lượt</span><span><b>"+c.people+"</b> người</span></div></div>";
    if(c.why) o+='<p class="note">'+esc(c.why)+"</p>";
    if(c.skew) o+='<p class="note">Một học viên chiếm '+Math.round(c.skew_top_share*100)+
      "% lượt của cụm — việc cần làm là nhắn riêng, không phải dành 15 phút của cả lớp.</p>";
    if(c._removed) o+='<p class="note">Đã chuyển '+c._removed+" câu ra nhóm rải rác — số lượt"+
      (c._approx?"":", số người và các cờ")+" đã tính lại."+(c.turns===0?" Cụm đã rỗng; mở ra bấm “Hoàn tác”.":"")+"</p>";
    o+='<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
       '<button class="toggle" type="button" data-open="'+esc(id)+'" aria-expanded="'+(open?"true":"false")+'">'+
       (open?"Ẩn":"Đọc")+" "+(c.examples||[]).length+" câu nguyên văn</button>"+
       (c.turns?'<button class="toggle" type="button" data-answer="'+esc(id)+'">'+
         (answers[id]&&answers[id].data?"Ẩn nội dung ôn":"✨ Soạn nội dung ôn")+"</button>":"")+
       "</div>"+answerHtml(id)+"</div></div>";
    if(open){
      o+='<div class="ex"><p class="lb">Câu nguyên văn, ID trỏ về dòng log — không viết lại, không tóm tắt</p><ul class="qs">';
      (c.examples||[]).forEach(function(e){
        o+='<li class="q'+(mv[e.turn_id]?" moved":"")+'"><span class="qid">'+esc(e.turn_id)+'</span>'+
           '<span class="qt">“'+esc(e.q)+'”</span><button class="qa" type="button" data-move="'+esc(e.turn_id)+'">'+
           (mv[e.turn_id]?"Hoàn tác":"Không thuộc cụm")+"</button></li>"; });
      o+="</ul></div>";
    }
    return o+"</li>";
  }

  bands.forEach(function(b){
    if(!b.rows.length) return;
    var list='<ol class="clusters">'+b.rows.map(function(c,r){return cardHtml(c,r,b.k);}).join("")+"</ol>";
    var head='<span class="bnm">'+esc(b.nm)+'</span><span class="bct num">'+b.rows.length+' cụm</span>'+
             '<span class="bsub">'+esc(b.sub)+'</span>';
    /* Băng cụm yếu gập sẵn — nhưng đếm số vẫn nằm ngay trên nhãn, nên không có
       chuyện con số bất lợi biến mất khỏi màn hình. */
    /* Băng cụm yếu gập sẵn khi đang xem tất cả — nhưng nếu người dùng vừa bấm
       đúng bộ lọc "Cụm yếu", hoặc nó là băng DUY NHẤT có cụm, thì gập lại là
       trả về một trang trống đúng lúc họ xin thấy. */
    var onlyBand = bands.filter(function(x){return x.rows.length;}).length===1;
    if(b.k==="b3" && state.filter!=="weak" && !onlyBand){
      h+=det("cum."+b.k,"band","<span class=\"bhd\">"+head+"</span>",list);
    } else {
      h+='<div class="band open"><div class="bhd">'+head+"</div>"+list+"</div>";
    }
  });

  h+='<div class="scatter"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">'+
     '<strong>Rải rác / không phân loại được</strong><span class="capt">'+scatterCount()+" lượt</span></div>"+
     '<p class="note">Câu quá ngắn, câu hành chính, câu lạc đề. Vẫn hiện để Lab Coach tự đọc — không nhét vào cụm gần nhất.</p>';
  if(s.scatter.examples_withheld){
    h+='<div class="banner warn" style="margin:10px 0 0"><span class="bi">ẨN</span><span>Chu kỳ này chỉ có <strong>'+
       s.students+' học viên</strong> hỏi. Dưới ngưỡng '+(TH.min_students_for_examples||3)+
       ' người thì hệ thống <strong>không hiện câu nguyên văn</strong> — ba câu của một người không còn là bức tranh của lớp, '+
       'mà là đọc trộm của một người. Số đếm vẫn hiện đầy đủ.</span></div>';
  }
  h+='<ul class="qs" style="margin-top:8px">'+
     (s.scatter.examples||[]).map(function(e){
       return '<li class="q"><span class="qid">'+esc(e.turn_id)+'</span><span class="qt">“'+esc(e.q)+'”</span></li>'; }).join("")+
     "</ul></div>";

  var nsel=0,tsel=0,psel=0;
  cls.forEach(function(c){ if(state.sel[s.key+"#"+c._i]){ nsel++; tsel+=c.turns; psel=Math.max(psel,c.people); } });
  if(nsel) h+='<div class="selbar"><span><b class="num">'+nsel+"</b> cụm đã chọn · "+tsel+
    " lượt hỏi · cụm đông nhất chạm "+psel+"/"+s.students+' học viên</span>'+
    '<span style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn go" type="button" id="mkfaq"'+(faq.running?" disabled":"")+'>'+
    (faq.running?'<span class="spin"></span> Đang soạn…':"📄 Xuất hỏi đáp cho VLearn")+"</button>"+
    '<button class="btn ghost" type="button" id="clearsel">Bỏ chọn</button></span></div>';

  h+=faqHtml();

  host.innerHTML=h;
  var cs=document.getElementById("clearsel");
  if(cs) cs.addEventListener("click",function(){ state.sel={}; faq.items=null; renderAll(); });
  var mk=document.getElementById("mkfaq");
  if(mk) mk.addEventListener("click",startFaq);
  var dl=document.getElementById("faqdl");
  if(dl) dl.addEventListener("click",downloadFaq);
  var cl=document.getElementById("faqclose");
  if(cl) cl.addEventListener("click",function(){ faq.items=null; faq.err=null; renderAll(); });
}

/* ══════════ NỘI DUNG ÔN DO AI SOẠN ══════════ */
var ANSWER_FIELDS=[
  ["misread","Học viên đang hiểu sai ở đâu","suy từ chính chữ họ viết, không phải chẩn đoán chung chung"],
  ["different","Giảng lại theo cách KHÁC slide","học viên đã đọc slide rồi mà vẫn hỏi — lặp lại cách cũ thì vô ích"],
  ["example","Ví dụ cụ thể",""],
  ["check","Câu kiểm tra nhanh","phân biệt hiểu thật với thuộc lòng"]
];
function answerHtml(id){
  var a=answers[id];
  if(!a) return "";
  if(a.loading) return '<div class="ansbox"><p class="capt"><span class="spin"></span> Đang nhờ AI soạn nội dung ôn…</p></div>';
  if(a.err) return '<div class="ansbox err"><p class="capt"><b>Không soạn được:</b> '+esc(a.err)+"</p></div>";
  var d=a.data;
  var h='<div class="ansbox"><div class="anshd"><span class="chip draft">bản nháp</span>'+
    '<span class="capt">Lab Coach là người quyết định cuối cùng — đây là vật liệu, không phải chỉ thị.'+
    (d.minutes?" Ước lượng ~"+d.minutes+" phút trên lớp.":"")+
    ' Độ chắc chắn model tự khai: <b>'+esc(d.confidence||"?")+"</b></span></div>";
  ANSWER_FIELDS.forEach(function(f){
    if(!d[f[0]]) return;
    h+='<div class="ansf'+(f[0]==="different"?" hi":"")+'"><dt>'+esc(f[1])+"</dt>"+
       (f[2]?'<dd class="capt">'+esc(f[2])+"</dd>":"")+"<dd>"+esc(d[f[0]])+"</dd></div>";
  });
  if(d.caveat) h+='<div class="ansf warn"><dt>Chỗ cần tự kiểm trước khi dùng</dt><dd>'+esc(d.caveat)+"</dd></div>";
  if(d.ai) h+='<p class="capt" style="margin-top:10px">Soạn bằng <code>'+esc(d.ai.model)+"</code> · "+
    fmt(d.ai.latency_ms)+" ms · "+fmt(d.ai.tokens_out)+" token ra</p>";
  return h+"</div>";
}
function requestAnswer(id, payload){
  if(answers[id] && answers[id].data){ delete answers[id]; renderAll(); return; }
  if(serverUp===false){
    answers[id]={err:"Cần máy chủ cục bộ để gọi AI. Chạy: python codebase/serve.py"};
    renderAll(); return;
  }
  answers[id]={loading:true}; renderAll();
  api("/api/answer",payload).then(function(d){ answers[id]={data:d}; renderAll(); })
    .catch(function(e){ answers[id]={err:String(e.message||e)}; renderAll(); });
}

/* ══════════ XUẤT HỎI ĐÁP CHO VLEARN ══════════
   Đây là thứ DUY NHẤT trong sản phẩm đi tới HỌC VIÊN. Vì thế nó là thứ duy nhất
   bắt buộc đi qua ba cửa: Lab Coach chọn cụm → hệ thống tự từ chối cụm không phải
   câu hỏi kiến thức → Lab Coach bỏ tick từng mục không muốn đăng. Không có nút
   "đăng thẳng lên VLearn": file tải về, người đăng là người.  */
var faq = { running:false, items:null, err:null };

function startFaq(){
  var s=cur(); if(!s) return;
  if(serverUp===false){ faq.err="Cần máy chủ cục bộ. Chạy: python codebase/serve.py"; renderAll(); return; }
  var picked=filtered().filter(function(c){ return state.sel[s.key+"#"+c._i] && c.turns>0; });
  if(!picked.length) return;
  var mv=movedSet();
  faq.running=true; faq.err=null;
  faq.items=picked.map(function(c){ return {name:c.name, people:c.people, turns:c.turns, state:"cho"}; });
  renderAll();
  var jobs=picked.map(function(c,i){
    return api("/api/faq",{lecture:(s.lecture_title?s.lecture_title+" · ":"")+s.lecture,
        name:c.name, people:c.people,
        turn_ids:c.turn_ids.filter(function(t){ return !mv[t]; })})
      .then(function(d){ faq.items[i].state="xong"; faq.items[i].d=d; faq.items[i].on=!!d.publishable; })
      .catch(function(e){ faq.items[i].state="loi"; faq.items[i].err=String(e.message||e); });
  });
  Promise.all(jobs).then(function(){ faq.running=false; renderAll(); });
}

function faqHtml(){
  if(faq.err) return '<div class="banner bad"><span class="bi">LỖI</span><span>'+esc(faq.err)+"</span></div>";
  if(!faq.items) return "";
  var done=faq.items.filter(function(x){return x.state!=="cho";}).length;
  var h='<div class="faqbox"><h3>Hỏi đáp để đăng lên VLearn</h3>'+
    '<p class="capt">Học viên khoá sau sẽ đọc thứ này một mình, không có giảng viên bên cạnh. '+
    'Bỏ tick mục nào bạn chưa muốn đăng — file chỉ chứa mục còn tick.</p>';
  if(faq.running) h+='<p class="capt" style="margin-top:10px"><span class="spin"></span> Đang soạn '+
    done+"/"+faq.items.length+" mục…</p>";

  faq.items.forEach(function(it,i){
    if(it.state==="cho"){ h+='<div class="faqitem"><div class="skel w70"></div><div class="skel w90"></div></div>'; return; }
    if(it.state==="loi"){
      h+='<div class="faqitem off"><div class="faqhd"><span class="qq">'+esc(it.name)+"</span></div>"+
         '<p class="faqmeta">Không soạn được: '+esc(it.err)+"</p></div>"; return;
    }
    var d=it.d, ok=!!d.publishable;
    h+='<div class="faqitem'+(it.on?"":" off")+'"><div class="faqhd">'+
       '<input type="checkbox" data-faq="'+i+'"'+(it.on?" checked":"")+(ok?"":" disabled")+
       ' aria-label="Đăng mục này"><span class="qq">'+esc(ok?d.question:it.name)+"</span></div>";
    if(ok){
      h+='<p class="faqans">'+esc(d.answer)+"</p>"+
         '<p class="faqmeta"><b>'+it.people+" học viên</b> đã hỏi chuyện này · "+it.turns+" lượt · "+
         (d.variants||[]).length+" cách hỏi khác · tin cậy <b>"+esc(d.confidence||"?")+"</b></p>";
      if(d.needs_review) h+='<p class="faqmeta">Cần bạn kiểm: '+esc(d.needs_review)+"</p>";
    } else {
      h+='<p class="faqmeta">Hệ thống từ chối đăng: '+esc(d.refuse_reason||"không phải câu hỏi kiến thức")+"</p>";
    }
    h+="</div>";
  });

  var n=faq.items.filter(function(x){return x.on;}).length;
  h+='<div class="faqfoot"><button class="btn go" type="button" id="faqdl"'+(n?"":" disabled")+'>⭳ Tải file Word (.doc) — '+n+' mục</button>'+
     '<button class="btn ghost" type="button" id="faqclose">Đóng</button>'+
     '<span class="capt">File tải về máy bạn. Không có nút đăng thẳng lên VLearn — người đăng là bạn.</span></div>';
  return h+"</div>";
}

function faqDoc(){
  // Word mở được HTML mang đuôi .doc — cách này giữ được tiêu đề, in đậm, danh sách
  // mà không cần thư viện ngoài. Có BOM UTF-8 để Word đọc đúng tiếng Việt.
  var s=cur(), on=faq.items.filter(function(x){return x.on && x.d && x.d.publishable;});
  var off=faq.items.filter(function(x){return x.d && !x.d.publishable;});
  var title="Hỏi đáp thường gặp — "+((s.lecture_title?s.lecture_title+" · ":"")+s.lecture);
  var b="";
  b+='<h1>'+esc(title)+"</h1>";
  b+='<p class="note">Tổng hợp từ câu hỏi thật của học viên khoá trước trong chính buổi học này. '+
     "Bản nháp do AI soạn từ "+fmt(s.real_turns)+" lượt hỏi của "+s.students+" học viên, "+
     "<b>đã được Lab Coach đọc và duyệt</b> trước khi đăng. Thấy chỗ nào chưa đúng, báo lại để sửa.</p>";
  on.forEach(function(it,i2){
    var d=it.d;
    b+="<h2>"+(i2+1)+". "+esc(d.question)+"</h2>";
    b+="<p>"+esc(d.answer)+"</p>";
    if((d.variants||[]).length){
      b+='<p class="alt"><i>Câu này còn hay được hỏi theo kiểu:</i> '+
         d.variants.map(function(v){ return "&ldquo;"+esc(v)+"&rdquo;"; }).join(" &middot; ")+"</p>";
    }
    b+='<p class="meta">'+it.people+" học viên khoá trước đã hỏi chuyện này ("+it.turns+" lượt).</p>";
    if(i2<on.length-1) b+="<hr>";
  });
  if(off.length){
    // nội dung này do model sinh ra: phải làm sạch trước khi đặt vào HTML comment,
    // nếu không một dấu "--" hay ">" trong tên cụm sẽ làm vỡ comment và đẩy chữ ra file.
    var safe=function(x){ return String(x==null?"":x).replace(/[<>]/g," ").replace(/-{2,}/g,"-"); };
    b+="<!-- Hệ thống đã tự loại "+off.length+" cụm khỏi bản hỏi đáp này: "+
       off.map(function(it){ return safe(it.name)+" — "+safe(it.d.refuse_reason); }).join(" | ")+" -->";
  }
  return "\ufeff<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
    "xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>"+
    "<head><meta charset='utf-8'><title>"+esc(title)+"</title>"+
    "<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom>"+
    "</w:WordDocument></xml><![endif]-->"+
    "<style>@page{size:A4;margin:2.2cm}"+
    "body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;color:#111}"+
    "h1{font-family:Arial,sans-serif;font-size:19pt;margin:0 0 4pt}"+
    "h2{font-family:Arial,sans-serif;font-size:14pt;margin:18pt 0 5pt}"+
    "p{margin:0 0 9pt;text-align:justify}"+
    "p.note{font-size:10.5pt;color:#444;border-left:3pt solid #2563eb;padding-left:9pt;margin-bottom:16pt}"+
    "p.alt{font-size:11pt;color:#333}"+
    "p.meta{font-size:9.5pt;color:#666}"+
    "hr{border:0;border-top:1pt solid #ddd;margin:16pt 0}"+
    "</style></head><body>"+b+"</body></html>";
}

function downloadFaq(){
  var s=cur();
  var blob=new Blob([faqDoc()],{type:"application/msword;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="hoi-dap-"+s.key+".doc"; a.click();

/* ══════════ CHẤT LƯỢNG ══════════ */
var CLSNAME={lop1:"① Nguồn sự thật",lop2:"② Mơ hồ / thiếu thông tin",lop3:"③ Ngoài phạm vi",
             lop4:"④ Đặc thù domain",thuong:"Thường gặp",hiem:"Hiếm"};
/* Dữ liệu đã chứa sẵn "slug — giải thích tiếng Việt"; code cũ cắt bằng
   split("—")[0] và giữ đúng nửa không ai đọc được. Giờ lấy nửa tiếng Việt làm
   nhãn, slug làm phụ chú cho người đi kiểm chứng. */
function errVi(name){
  var p=String(name||"").split("—");
  return (p.length>1 ? p.slice(1).join("—") : p[0]).trim();
}
function errSlug(name){ return String(name||"").split("—")[0].trim(); }

/* Khoá assertion là tiếng Anh vì nó là tên trong mã nguồn — giữ nguyên cho
   người đi kiểm, nhưng kèm nghĩa. Và bỏ trùng: một case trượt cùng một
   assertion hai lần thì in hai lần là nhiễu, không phải thông tin. */
var ASSERT_VI={
  must_not_group_together:"gộp nhầm hai vấn đề khác nhau",
  must_be_unclustered:"nặn câu rác thành cụm",
  must_group_together:"tách nhầm một vấn đề thành hai cụm",
  no_invented_ids:"bịa mã câu hỏi không có thật",
  no_duplicate_ids:"xếp một câu vào hai cụm",
  counts_reconcile:"số đếm không khớp đầu vào",
  min_clusters:"gom ra quá ít cụm",
  max_clusters:"gom ra quá nhiều cụm",
  all_fields_present:"thiếu phần bắt buộc trong kết quả",
  no_student_identifiers:"để lộ mã học viên",
  no_imperative:"viết như ra lệnh cho giảng viên",
  output_is_vietnamese:"trả lời không phải tiếng Việt",
  expect_confidence_in:"tự khai độ chắc chắn sai mức",
  caveat_flags:"không nêu đúng cảnh báo cần có",
  must_mention_any:"không bám vào chữ học viên viết",
  must_not_mention:"kéo vào khái niệm không ai hỏi",
  check_not_definition_recall:"câu kiểm tra chỉ hỏi thuộc lòng"
};
function failVi(keys){
  var seen={}, out=[];
  (keys||[]).forEach(function(k){
    if(seen[k]) return; seen[k]=1;
    out.push(ASSERT_VI[k] ? ASSERT_VI[k]+' <code class="sl">'+esc(k)+"</code>" : "<code>"+esc(k)+"</code>");
  });
  return out.join(" · ");
}
function firstSentence(t){
  var m=String(t||"").match(/^[\s\S]*?[.!?](\s|$)/);
  return (m?m[0]:String(t||"")).trim();
}

/* ══════════ NHẬT KÝ AI ══════════ */
/* call_id có dạng "run:K4P1/D04:p1/6", "eval3:C1-01", "live:answer"…
   Nhóm theo tiền tố để người đọc lọc được đúng loại bằng chứng họ đang nghi. */
var CALLKIND=[
  {k:"run",  nm:"Gom cụm buổi học", re:/^run\b/,          hint:"Quyết định AI chính — chạy khi dựng dữ liệu một buổi"},
  {k:"eval", nm:"Chạy bộ kiểm thử", re:/^eval/,           hint:"Mỗi case một lời gọi, số đo ở tab Chất lượng ra từ đây"},
  {k:"live", nm:"Thử trực tiếp",    re:/^live/,           hint:"Bấm nút trên tab Thử trực tiếp, kể cả soạn nội dung ôn và hỏi đáp"}
];
function callKind(c){
  var id=String(c.call_id||"");
  for(var i=0;i<CALLKIND.length;i++) if(CALLKIND[i].re.test(id)) return CALLKIND[i].k;
  return "khac";
}

var live = { health:null, samples:[], busy:false, result:null, err:null, step:0, src:"sample", items:null, label:null, pending:null };

function api(path,body){
  var opt = body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {};
  return fetch(path,opt).then(function(r){
    return r.json().then(function(j){ if(!r.ok||j.error) throw new Error(j.error||("HTTP "+r.status)); return j; }); });
}
