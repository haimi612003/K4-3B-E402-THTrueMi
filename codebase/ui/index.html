function updCount(){
  var box=document.getElementById("qbox"); if(!box) return;
  var n=box.value.split("\n").map(function(x){return x.trim();}).filter(Boolean).length;
  var max=(live.health&&live.health.max_questions)||60;
  var c=document.getElementById("qcount");
  c.textContent=n+" câu"+(n>max?" — quá "+max+" câu, máy chủ sẽ từ chối":"");
  c.style.color = n>max ? css("--critical-ink") : "";
  var rb=document.getElementById("runbtn");
  if(rb) rb.disabled = live.busy || !n || n>max;
}

var STEPS=["Gửi câu hỏi lên máy chủ cục bộ","Máy chủ gọi model Gemini","Model trả JSON danh sách cụm","Code tính số người và các cờ"];
function renderSteps(){
  var box=document.getElementById("steps"); if(!box) return;
  box.innerHTML=STEPS.map(function(s,i){
    var cls = live.step>i+1 ? "done" : (live.step===i+1 ? "on" : "");
    var dot = live.step>i+1 ? "✓" : (live.step===i+1 ? '<span class="spin"></span>' : String(i+1));
    return '<div class="step '+cls+'"><span class="dot">'+dot+"</span>"+esc(s)+"</div>"; }).join("");
}

function doGenerate(){
  var inp=document.getElementById("gtopic"), topic=(inp.value||"").trim();
  if(!topic) return;
  lsSet("cp.topic",topic);
  var btn=document.getElementById("gbtn");
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> Đang sinh…';
  api("/api/generate",{topic:topic,n:14}).then(function(r){
    live.items=null; live.label="AI sinh · "+topic;
    live.pending=(r.questions||[]).join("\n");
    document.getElementById("qbox").value=live.pending;
    updCount(); btn.disabled=false; btn.textContent="✨ Sinh lại";
  }).catch(function(e){
    btn.disabled=false; btn.textContent="✨ Sinh 14 câu hỏi";
    live.err=String(e.message||e); live.result=null;
    document.getElementById("liveout").innerHTML=liveOutHtml();
  });
}

function doCluster(){
  var box=document.getElementById("qbox");
  var lines=box.value.split("\n").map(function(x){return x.trim();}).filter(Boolean);
  if(!lines.length) return;
  // Giữ mã học viên thật khi dùng bộ mẫu, để cờ tín hiệu lệch có ý nghĩa.
  var payload=lines;
  if(live.items && live.items.length===lines.length &&
     live.items.every(function(it,i){ return it.q===lines[i]; })) payload=live.items;

  live.busy=true; live.err=null; live.result=null; live.step=1;
  updCount(); renderSteps();
  document.getElementById("liveout").innerHTML=liveOutHtml();
  var t=setTimeout(function(){ if(live.busy){ live.step=2; renderSteps(); } },350);
  api("/api/cluster",{questions:payload,label:live.label||"Thử trực tiếp"}).then(function(r){
    clearTimeout(t); live.busy=false; live.result=r; live.step=4; renderSteps();
    setTimeout(function(){ live.step=0; renderSteps(); },600);
    document.getElementById("liveout").innerHTML=liveOutHtml(); updCount();
  }).catch(function(e){
    clearTimeout(t); live.busy=false; live.step=0; renderSteps();
    live.err=String(e.message||e);
    document.getElementById("liveout").innerHTML=liveOutHtml(); updCount();
  });
}

var panels={home:"p-home",tong:"p-tong",cum:"p-cum",eval:"p-eval",log:"p-log",live:"p-live"};
var renderers={home:renderHome,tong:renderTong,cum:renderCum,eval:renderEval,log:renderLog,live:renderLive};
function show(name){
  if(!panels[name]) name="tong";
  active=name;
  Object.keys(panels).forEach(function(k){ document.getElementById(panels[k]).hidden=(k!==name); });
  renderShell(); renderers[name]();
  lsSet("cp.tab",name);
  if(location.hash.slice(1)!==name) history.replaceState(null,"","#"+name);
  document.getElementById("main").scrollTop=0;
  bgScroll.resync();
  animate();
}
function animate(){
  var host=document.getElementById(panels[active]);
  playEnter(host); growBars(host);
  playEnter(document.getElementById("chips"));
}
// renderAll dùng cho thay đổi nhỏ (tick, mở cụm) — không chạy lại hiệu ứng vào màn,
// chỉ vẽ lại số và thanh để chúng khớp dữ liệu mới.
/* ── gập/mở giữ được qua mỗi lần dựng lại ─────────────────────────────
   renderAll() gán đè innerHTML nên trạng thái open của <details> nằm trong DOM
   sẽ bị xoá sạch mỗi lần tick một cụm hay bấm đọc câu nguyên văn. Vì thế trạng
   thái phải sống trong state.det, ngoài DOM. Sự kiện `toggle` KHÔNG nổi bọt nên
   listener bắt buộc đặt ở pha capture.  */
function det(id, cls, summaryHtml, bodyHtml){
  return '<details class="'+cls+'" data-det="'+esc(id)+'"'+(state.det[id]?" open":"")+">"+
         "<summary>"+summaryHtml+"</summary>"+bodyHtml+"</details>";
}
document.addEventListener("toggle", function(e){
  var t=e.target, id=t && t.dataset && t.dataset.det;
  if(!id) return;
  if(t.open) state.det[id]=1; else delete state.det[id];
}, true);

function renderAll(){ renderShell(); renderers[active](); }
function renderAllAnimated(){ renderAll(); animate(); }
/* Đổi bộ lọc thì thứ đổi thật chỉ là danh sách cụm. Phát lại hiệu ứng vào màn cho
   cả panel + 19 ô chip là nói "mọi thứ vừa đổi" trong khi không phải, và bắt mắt
   quét lại từ đầu mỗi lần chạm vào bộ lọc. Chỉ cho thanh mọc lại. */
function renderAllQuiet(){ renderAll(); growBars(document.getElementById(panels[active])); }
function setSort(v){ state.sort=v; lsSet("cp.sort",v); renderAllAnimated(); }

document.addEventListener("click",function(e){
  var t=e.target.closest ? e.target.closest("[data-tab],[data-open],[data-move],[data-filter],[data-answer],[data-lanswer],[data-evalkind],[data-goto],[data-opendet],[data-logkind],[data-sess]") : null;
  if(!t) return;
  if(t.dataset.tab){ show(t.dataset.tab); return; }
  if(t.dataset.goto!=null){ state.open[t.dataset.goto]=1; show("cum"); return; }
  if(t.dataset.sess!=null){ var si=+t.dataset.sess;
    if(D.sessions[si]){ state.sess=si; lsSet("cp.sess",si); }
    show("cum"); return; }
  if(t.dataset.opendet){ var dd=document.querySelector('[data-det="'+t.dataset.opendet+'"]');
    if(dd){ dd.open=true; state.det[t.dataset.opendet]=1; dd.scrollIntoView({block:"start"}); } return; }
  if(t.dataset.filter){ state.filter=t.dataset.filter; lsSet("cp.filter",state.filter); renderAllQuiet(); return; }
  if(t.dataset.evalkind){ state.evalKind=t.dataset.evalkind; lsSet("cp.evalkind",state.evalKind); renderAllAnimated(); return; }
  if(t.dataset.logkind){ state.logKind=t.dataset.logkind; renderAll(); return; }
  if(t.dataset.open!=null){ var k=t.dataset.open;
    if(state.open[k]) delete state.open[k]; else state.open[k]=1; renderAll(); return; }
  if(t.dataset.move!=null){ var mv=movedSet(), id=t.dataset.move;
    if(mv[id]) delete mv[id]; else mv[id]=1; saveMoved(); renderAll(); return; }
  if(t.dataset.answer!=null){
    var s2=cur(), key=t.dataset.answer, ci=+key.split("#")[1], c=(s2?s2.clusters[ci]:null);
    if(!c) return;
    var mv2=movedSet();
    requestAnswer(key,{lecture:(s2.lecture_title?s2.lecture_title+" · ":"")+s2.lecture,
      name:c.name, why:c.why, people:c.people,
      turn_ids:c.turn_ids.filter(function(x){return !mv2[x];}),
      questions:(c.examples||[]).map(function(e){return e.q;})});
    return;
  }
  if(t.dataset.lanswer!=null){
    var li=+t.dataset.lanswer, lc=(live.result&&live.result.clusters[li]);
    if(!lc) return;
    requestAnswer("live#"+li,{lecture:live.label||"Thử trực tiếp", name:lc.name, why:lc.why,
      people:lc.people, turn_ids:lc.turn_ids,
      questions:(lc.examples||[]).map(function(e){return e.q;})});
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset && t.dataset.sel!=null){
    if(t.checked) state.sel[t.dataset.sel]=1; else delete state.sel[t.dataset.sel];
    renderAll(); return; }
  if(t.dataset && t.dataset.faq!=null && faq.items){
    faq.items[+t.dataset.faq].on = t.checked; renderAll(); }
});

state.evalKind=lsGet("cp.evalkind","cluster");
var qs=new URLSearchParams(location.search);
// ?filter=top|strong|weak|skew|all — mở thẳng một bộ lọc, tiện khi demo deep-link.
if(["all","top","strong","weak","skew"].indexOf(qs.get("filter"))>=0) state.filter=qs.get("filter");
if(qs.get("sample")) live.autorun={sample:qs.get("sample"), run:qs.get("run")==="1"};
// ?answer=1 — soạn luôn nội dung ôn cho cụm đông nhất, tiện khi demo.
if(qs.get("answer")==="1") setTimeout(function(){
  var b=document.querySelector("[data-answer]"); if(b) b.click(); },900);
// ?faq=N — tick N cụm đầu rồi soạn luôn bản hỏi đáp, tiện khi demo.
if(qs.get("faq")) setTimeout(function(){
  var n=Math.max(1,Math.min(+qs.get("faq")||2,6)), s2=cur();
  if(!s2) return;
  filtered().slice(0,n).forEach(function(c){ state.sel[s2.key+"#"+c._i]=1; });
  renderAll(); startFaq();
},900);
var savedSess=lsGet("cp.sess",0);
if(savedSess>=0 && savedSess<D.sessions.length) state.sess=savedSess;
var start=location.hash.slice(1);
if(live.autorun) start="live";

bootAuth().then(function(ok){
  if(!ok) return;                       // đang ở màn đăng nhập
  var lo=document.getElementById("logoutbtn");
  fetch("/api/session").then(function(r){return r.json();}).then(function(j){
    if(j.need_passcode && j.authed && lo){
      lo.hidden=false;
      lo.addEventListener("click",function(){
        fetch("/api/logout",{method:"POST"}).then(function(){ location.reload(); });
      });
    }
  }).catch(function(){});
  bgScroll.attach();
  show(panels[start]?start:lsGet("cp.tab","home"));
  addEventListener("hashchange",function(){ var n=location.hash.slice(1); if(panels[n]&&n!==active) show(n); });
});
})();
</script>
</body>
</html>
